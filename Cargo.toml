[package]
name = "reactive-tui"
version = "0.0.7"
edition = "2021"
authors = ["Reactive-TUI Contributors"]
description = "A modern, reactive terminal user interface library with CSS-like styling and comprehensive image support"
documentation = "https://docs.rs/reactive-tui"
repository = "https://github.com/entrepeneur4lyf/reactive-tui"
license = "MIT"
keywords = ["tui", "terminal", "ui", "reactive", "css"]
categories = ["command-line-interface", "gui", "graphics"]
readme = "README.md"
exclude = [
    "reference/",
    "docs/analysis/",
    "docs/reviews/",
    "*.tmp",
    "test_image.png"
]

[dependencies]
bitflags = "2.9.3"
crossterm = "0.29.0"
serde = { version = "^1.0", features = ["derive"] }
taffy = "0.9.1"
tokio = { version = "1.45", features = ["sync", "time", "rt", "rt-multi-thread", "io-util", "io-std", "net", "fs", "macros"], optional = true }
tokio-util = { version = "0.7", optional = true }
unicode-width = "0.2.1"
unicode-segmentation = "1.12"
lazy_static = "1.4"
syntect = { version = "5.2", default-features = false, features = ["default-fancy", "yaml-load", "plist-load"] }
once_cell = "1.19"
comrak = "0.41"
thiserror = "1.0"
string_cache = "0.8"
# Image support dependencies (enabled by default)
image = "0.25.6"
base64 = "0.22.1"
sixel-rs = "0.5.0"
reactive-tui-macros = { path = "reactive-tui-macros" }

# Platform-specific dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "commapi", "fileapi", "handleapi", "processenv", "winbase"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem"] }


[lib]
name = "reactive_tui"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]


[features]
default = ["tokio"]
# Enable debug logging in reconcile apply_patches
debug_patches = []
# Animation and general debug logging toggle used by src/animation/debug.rs
# Keeping empty feature to satisfy cfg checks without changing behavior
debug = []
# Enable SIMD optimizations for color operations (requires nightly Rust)
simd = []
# Enable async capability detection
async-capabilities = ["tokio"]
# Enable FFI bindings (C ABI)
ffi = []

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "diff_benchmark"
harness = false
