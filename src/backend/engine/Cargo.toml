[package]
name = "reactive-tui-suprtui"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Reactive TUI's maintained terminal rendering engine, adapted from SuprTUI"
repository = "https://github.com/eas4ai/reactive-tui"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "LICENSE", "LICENSE-OpenTUI", "UPSTREAM.md"]

[lib]
name = "suprtui"
path = "src/lib.rs"

[dependencies]
unicode-segmentation = "1.13.3"
unicode-properties = "0.1.4"
vte = "0.14"
taffy = "0.13"
image = "0.25"
