[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]
all-features = true

[advisories]
# Unmaintained crates are reported only when the workspace depends on them
# directly, the developer's choice on 2026-09-26: we can replace our own
# dependencies, while one deeper in the tree waits for the crate that uses
# it. Vulnerable and unsound crates are reported everywhere.
unmaintained = "workspace"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # Reactive TUI's own crates: the MIT grant with the framework rider and
    # the sponsorship rider, under a license name of its own (see LICENSE).
    "LicenseRef-ReactiveTUI-1.0",
]
exceptions = [
    # bindgen only, approved by the developer on 2026-09-26: libghostty-vt-sys's
    # gen-bindings tool (feature bindgen-tool) uses it to regenerate the C
    # bindings by hand; no bindgen code is built into the library.
    { crate = "bindgen@=0.73.2", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { crate = "atty", reason = "Unused, unmaintained, and unsound; DQC-001 requires removal." },
]
skip = [
    { crate = "hashbrown@=0.16.1", reason = "wgpu 30 (decision 01M3MBDJ64ZZXKKWFZ2BV60CVQ): gpu-allocator 0.28 uses the 0.16 API, which is not compatible with the root graph's 0.17 line." },
    { crate = "io-lifetimes@2.0.4", reason = "fs-set-times has not moved to the io-lifetimes line used by cap-std." },
    { crate = "phf_shared@0.11.3", reason = "string_cache retains phf 0.11 while the accessibility adapter and comrak use phf 0.13." },
    { crate = "rustc-hash@=1.1.0", reason = "wgpu 30 (decision 01M3MBDJ64ZZXKKWFZ2BV60CVQ): Naga and wgpu-core retain 1 while comrak uses the incompatible 2 API." },
    { crate = "syn@2.0.106", reason = "The proc-macro graph is transitioning independently from syn 2 to syn 3." },
    { crate = "thiserror@=1.0.69", reason = "filedescriptor 0.8 (the terminal crate's /dev/tty reader) and redox_users (through dirs) use the 1.x derive API while the root and wgpu use 2.x." },
    { crate = "thiserror-impl@=1.0.69", reason = "thiserror 1.0.69 requires its matching derive implementation." },
    { crate = "windows-sys@0.48.0", reason = "dirs retains the Windows 0.48 support crates." },
    { crate = "windows-sys@0.59.0", reason = "The public Windows API and cap-std graph retain the 0.59 support crates." },
    { crate = "windows-sys@0.60.2", reason = "comrak and terminal helpers retain the 0.60 support crates." },
    { crate = "windows-targets@0.48.5", reason = "windows-sys 0.48 requires its matching generated target crates." },
    { crate = "windows-targets@0.52.6", reason = "windows-sys 0.59 requires its matching generated target crates." },
    { crate = "windows_x86_64_gnu@0.48.5", reason = "windows-targets 0.48 requires its matching generated target crate." },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "windows-targets 0.52 requires its matching generated target crate." },
    { crate = "windows_x86_64_msvc@0.48.5", reason = "windows-targets 0.48 requires its matching generated target crate." },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "windows-targets 0.52 requires its matching generated target crate." },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
