[package]
name = "reactive-tui-crossterm"
version = "1.0.0"
edition = "2021"
rust-version = "1.91"
description = "Reactive TUI's maintained Crossterm fork with Unix input readiness fixes"
documentation = "https://docs.rs/reactive-tui-crossterm"
repository = "https://github.com/eas4ai/reactive-tui"
license = "MIT"
publish = false
readme = "README.md"
keywords = ["event", "cli", "input", "terminal"]
categories = ["command-line-interface"]
include = ["/src/**", "/README.md", "/LICENSE", "/REACTIVE_TUI_PATCH.md"]
autobins = false
autoexamples = false
autobenches = false

[package.metadata.docs.rs]
all-features = true

[lib]
name = "crossterm"
path = "src/lib.rs"

[features]
default = ["bracketed-paste", "events", "windows", "derive-more"]
bracketed-paste = []
events = ["dep:mio", "dep:signal-hook", "dep:signal-hook-mio"]
windows = ["dep:winapi", "dep:crossterm_winapi"]
event-stream = ["dep:futures-core", "events"]
serde = ["dep:serde", "bitflags/serde"]
use-dev-tty = ["filedescriptor", "rustix/process"]
derive-more = ["dep:derive_more"]
osc52 = ["dep:base64"]

[dependencies]
base64 = { version = "0.22", optional = true }
bitflags = "2.9"
derive_more = { version = "2.0.0", features = ["is_variant"], optional = true }
document-features = "0.2.11"
futures-core = { version = "0.3", optional = true, default-features = false }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"], optional = true }

[target.'cfg(windows)'.dependencies]
crossterm_winapi = { version = "0.9.1", optional = true }
winapi = { version = "0.3.9", optional = true, features = ["winuser", "winerror"] }

[target.'cfg(unix)'.dependencies]
filedescriptor = { version = "0.8", optional = true }
libc = { version = "0.2", default-features = false, optional = true }
mio = { version = "1.0", features = ["os-poll"], optional = true }
rustix = { version = "1", default-features = false, features = ["std", "stdio", "termios", "event"] }
signal-hook = { version = "0.3.17", optional = true }
signal-hook-mio = { version = "0.2.4", features = ["support-v1_0"], optional = true }

[dev-dependencies]
async-std = "1.13"
futures = "0.3"
futures-timer = "3.0"
serde_json = "1.0"
serial_test = "3.0.0"
temp-env = "0.3.6"
tokio = { version = "1.44", features = ["full"] }

# The raw mode test runs on a pseudo-terminal of its own.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "pty", "process"] }
