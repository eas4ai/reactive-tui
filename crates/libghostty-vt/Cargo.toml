[package]
name = "reactive-tui-libghostty-vt"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
description = "Reactive TUI's pinned safe Rust API for the Ghostty terminal emulation library"
repository = "https://github.com/eas4ai/reactive-tui"
license = "MIT"
publish = false
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE", "/UPSTREAM.md"]

[lib]
name = "libghostty_vt"

[features]
default = ["kitty-graphics"]
allocator_api = ["dep:allocator-api2"]
kitty-graphics = ["libghostty-vt-sys/kitty-graphics"]
png = ["dep:png"]
log = ["dep:log"]
link-dynamic = ["libghostty-vt-sys/link-dynamic"]
tracing = ["dep:tracing"]

[dependencies]
allocator-api2 = { version = "0.4.0", optional = true }
bitflags = "2.11.0"
libghostty-vt-sys = { package = "reactive-tui-libghostty-vt-sys", path = "../libghostty-vt-sys", version = "=1.0.0" }
int-enum = "1.2.0"
png = { version = "0.18.1", optional = true }
log = { version = "0.4.29", optional = true }
tracing = { version = "0.1.44", optional = true }

[dev-dependencies]
libghostty-vt-sys = { package = "reactive-tui-libghostty-vt-sys", path = "../libghostty-vt-sys", version = "=1.0.0" }

[package.metadata.docs.rs]
all-features = true
