name: Supported-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: supported-platform-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: platform (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each job pins its toolchain in full, at or above Cargo.toml's
        # rust-version, installs it beside the runner's own and names it on
        # every cargo call; the runner's default toolchain and default host
        # stay as they are (docs/spec/quality-bar.md, BAR-012).
        include:
          - os: ubuntu-24.04
            toolchain: 1.95.0
          - os: macos-14
            toolchain: 1.95.0
          - os: windows-2022
            toolchain: 1.95.0-x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      TOOLCHAIN: ${{ matrix.toolchain }}
      # A script that runs cargo itself resolves to the same toolchain.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: macOS native build prerequisites
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config
      - name: Install the pinned Rust and dependency tools
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          cargo "+$TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
          python -m pip install -r scripts/requirements-ci.txt
      - name: Build default targets
        run: cargo "+$TOOLCHAIN" build --locked --all-targets
      - name: ConPTY runtime beside the Windows test binaries
        if: runner.os == 'Windows'
        run: python -B scripts/install-conpty-runtime.py target/debug/deps --arch x64
      - name: The curl the dialog HTTP tests run
        if: runner.os == 'Windows'
        run: where.exe curl; curl --version | head -1
      - name: Default tests and doctests
        run: cargo "+$TOOLCHAIN" test --locked --no-fail-fast
      - name: Workspace formatting
        run: cargo "+$TOOLCHAIN" fmt --all -- --check
      - name: Strict default-target Clippy
        run: cargo "+$TOOLCHAIN" clippy --locked --all-targets -- -D warnings
      - name: Dependency advisories, bans, licenses and sources
        run: cargo "+$TOOLCHAIN" deny --locked check advisories bans licenses sources
      - name: CI event and failure fixtures
        run: python -B scripts/check-pre-release-ci.py RID-001

  advisories:
    name: scheduled security advisories
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TOOLCHAIN: 1.95.0
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Rust and security tools
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          cargo "+$TOOLCHAIN" install cargo-audit --version 0.22.1 --locked
          cargo "+$TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
      - name: Locked advisory, license, source, and duplicate checks
        run: python -B scripts/check-pre-release-dependency-code-quality.py DQC-001
