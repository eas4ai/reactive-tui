name: Supported-platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: supported-platform-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: platform (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: macOS native build prerequisites
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config
      - name: Windows native build prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm autoconf automake libtool make pkgconf mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup set default-host x86_64-pc-windows-gnu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install supported Rust and audit tool
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.91.0
          cargo +1.91.0 install cargo-audit --version 0.22.1 --locked
          python -m pip install -r scripts/requirements-ci.txt
      - name: Build default targets
        run: cargo +1.91.0 build --locked --all-targets
      - name: Default tests and doctests
        run: cargo +1.91.0 test --locked --no-fail-fast
      - name: Workspace formatting
        run: cargo +1.91.0 fmt --all -- --check
      - name: Strict default-target Clippy
        run: cargo +1.91.0 clippy --locked --all-targets -- -D warnings
      - name: Dependency maintenance and feature graphs
        run: python -B scripts/check-pre-release-dependency-maintenance.py DQC-002
      - name: CI event and failure fixtures
        run: python -B scripts/check-pre-release-ci.py RID-001

  advisories:
    name: scheduled security advisories
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install supported Rust and security tools
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
          cargo +1.91.0 install cargo-audit --version 0.22.1 --locked
          cargo +1.91.0 install cargo-deny --version 0.20.2 --locked
      - name: Locked advisory, license, source, and duplicate checks
        run: python -B scripts/check-pre-release-dependency-code-quality.py DQC-001
