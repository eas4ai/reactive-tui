name: Native clipboard evidence

on:
  push:
    branches: [codex/clipboard-platform-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipboard-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clipboard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            backend: macos
          - os: windows-2022
            backend: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          python -m venv "$RUNNER_TEMP/rtui-image-python"
          "$RUNNER_TEMP/rtui-image-python/bin/python" -m pip install 'Pillow==11.3.0'
      - name: Windows build prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm autoconf automake libtool make pkgconf mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.95.0-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0-x86_64-pc-windows-gnu
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Native clipboard round trips and child cleanup
        shell: bash
        run: python -B scripts/check-clipboard-platforms.py --backend ${{ matrix.backend }} --dedicated-desktop
      - name: Native ConPTY behavior and violating resize
        if: always() && runner.os == 'Windows'
        shell: bash
        run: python -B scripts/check-conpty-platform.py
      - name: Native HTTP, FileExplorer and TerminalWidget workflows
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            "$RUNNER_TEMP/rtui-image-python/bin/python" -B scripts/check-widget-platforms.py --dedicated-desktop
          else
            python -B scripts/check-widget-platforms.py --dedicated-desktop
          fi
      - name: Native local and performance hook ownership
        if: always()
        shell: bash
        run: python -B verification/api-residual/run-native-hooks.py
      - name: Native macOS public entry points and queued input
        if: always() && runner.os == 'macOS'
        shell: bash
        env:
          CARGO_BUILD_JOBS: '8'
          RUST_TEST_THREADS: '8'
          RAYON_NUM_THREADS: '8'
          LP_NUM_THREADS: '8'
          PYTHON_CPU_COUNT: '8'
          GOMAXPROCS: '8'
          GOFLAGS: '-p=8'
          CARGO_INCREMENTAL: '0'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: python -B verification/api-entry-points/run-native.py
      - name: Capture native macOS entry-point evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: entry-points-macos
          path: target/evidence/api-entry-points/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Capture native hook evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hooks-${{ matrix.backend }}
          path: target/evidence/api-residual/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Capture native widget evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widgets-${{ matrix.backend }}
          path: target/evidence/widget-platforms/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Capture native ConPTY evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conpty-windows
          path: docs/analysis/conpty-platform/*
          if-no-files-found: warn
          retention-days: 14
      - name: Capture native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipboard-${{ matrix.backend }}
          path: target/evidence/clipboard-platforms/${{ matrix.backend }}.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Capture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipboard-${{ matrix.backend }}-diagnostics
          path: target/clipboard-platform-failure.log
          if-no-files-found: warn
          retention-days: 14
