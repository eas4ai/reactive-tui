name: Native clipboard evidence

on:
  push:
    branches: [codex/clipboard-platform-verification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipboard-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-startup-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Measure cold and warm PowerShell clipboard calls on a separate desktop
        shell: python
        run: |
          import json, pathlib, re, subprocess, tempfile, time
          source = pathlib.Path('src/hooks/clipboard.rs').read_text()
          scripts = re.findall(r'"(\$ErrorActionPreference[^"\n]+)"', source)
          assert len(scripts) == 2
          payload = b'simple ascii\n'
          for iteration in range(3):
              for mode, script in zip(('copy', 'paste'), scripts):
                  with tempfile.TemporaryFile() as stdin, tempfile.TemporaryFile() as stdout, tempfile.TemporaryFile() as stderr:
                      stdin.write(payload if mode == 'copy' else b'')
                      stdin.seek(0)
                      start = time.monotonic()
                      child = subprocess.Popen(['powershell', '-NoLogo', '-NoProfile', '-NonInteractive', '-Command', script], stdin=stdin, stdout=stdout, stderr=stderr)
                      try:
                          status = child.wait(timeout=30)
                      except subprocess.TimeoutExpired:
                          child.kill()
                          child.wait()
                          raise
                      elapsed = time.monotonic() - start
                      stdout.seek(0)
                      output = stdout.read()
                      stderr.seek(0)
                      error = stderr.read().decode(errors='replace')
                      print(json.dumps(dict(iteration=iteration, mode=mode, elapsed=elapsed, status=status, bytes=len(output), error=error)), flush=True)
                      assert status == 0
                      if mode == 'paste':
                          assert output == payload, repr(output)
  clipboard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            backend: macos
          - os: windows-2022
            backend: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Windows build prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm autoconf automake libtool make pkgconf mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.95.0-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0-x86_64-pc-windows-gnu
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Native clipboard round trips and child cleanup
        shell: bash
        run: python -B scripts/check-clipboard-platforms.py --backend ${{ matrix.backend }} --dedicated-desktop
      - name: Capture native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipboard-${{ matrix.backend }}
          path: docs/analysis/clipboard-platforms/${{ matrix.backend }}.*
          if-no-files-found: warn
          retention-days: 14
      - name: Capture failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipboard-${{ matrix.backend }}-diagnostics
          path: target/clipboard-platform-failure.log
          if-no-files-found: warn
          retention-days: 14
